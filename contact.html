<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mvelo Fresh Farm — Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">MVELO FRESH FARM</div>
        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="index.html#about">About Us</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="enquiry.html">Enquiries</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="section">
        <h2>Contact Our Team</h2>
        <p>Send a direct email message to our team at Mvelo Fresh Farm.</p>

        <form id="contactForm" action="mailto:info@mvelofreshfarm.co.za" method="POST" enctype="text/plain" class="form-container" novalidate>
            <div class="form-group">
                <label for="contactName">Your Name:</label>
                <input type="text" id="contactName" name="Name" placeholder="Enter your full name">
                <small class="error-msg" id="cNameError"></small>
            </div>

            <div class="form-group">
                <label for="contactEmail">Your Email:</label>
                <input type="email" id="contactEmail" name="Email" placeholder="name@example.com">
                <small class="error-msg" id="cEmailError"></small>
            </div>

            <div class="form-group">
                <label for="subject">Message Subject:</label>
                <input type="text" id="subject" name="Subject" placeholder="e.g. General Question">
                <small class="error-msg" id="cSubjectError"></small>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="Message" rows="5" placeholder="Write your message here..."></textarea>
                <small class="error-msg" id="cMessageError"></small>
            </div>

            <button type="submit" class="btn">Send Email</button>
        </form>

        <div id="contactResponse" class="response-box" style="display: none;"></div>
    </main>

    <footer>
        <p>&copy; Mvelo Fresh Farm. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
